[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipcompiler"
version = "0.7.0"
description = "Procedural digital logic compiler, executable DLS, diagnostics, IDE and external EDA orchestration"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "pycparser>=2.22,<4"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8"]

[project.scripts]
chipcompiler = "chipcompiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
