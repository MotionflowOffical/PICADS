[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picads"
version = "0.16.8"
description = "PICADS - Procedural Integrated Circuit Architecture and Design System"
authors = [{ name = "MotionflowOffical" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "pycparser>=2.22,<4"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8"]

[project.scripts]
chipcompiler = "chipcompiler.cli:main"
picads = "chipcompiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
